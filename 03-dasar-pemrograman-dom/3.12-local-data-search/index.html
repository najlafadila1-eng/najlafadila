<!DOCTYPE html>
<html>
<head>
  <title>Pencarian Barang</title>
</head>
<body>
  <h1>Pencarian Barang</h1>

  <input id="cari" type="text" placeholder="Cari barang">
  <button id="tombol">Cari</button>

  <ul id="hasil"></ul>

  <script>
    const barang = ["Pensil", "Buku", "Penghapus", "Penggaris", "Spidol"];

    const input = document.getElementById("cari");
    const tombol = document.getElementById("tombol");
    const hasil = document.getElementById("hasil");

    tombol.addEventListener("click", function () {
      hasil.innerHTML = "";

      const kata = input.value.toLowerCase();

      const ditemukan = barang.filter(nama =>
        nama.toLowerCase().includes(kata)
      );

      ditemukan.forEach(nama => {
        const item = document.createElement("li");
        item.textContent = nama;
        hasil.appendChild(item);
      });
    });
  </script>
</body>
</html>
